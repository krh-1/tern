<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tern</title>
<meta name="description" content="Walk a quiet ink-drawn park, answer hard questions, and watch a portrait of how you decide take shape.">
<meta property="og:type" content="website">
<meta property="og:title" content="Tern">
<meta property="og:description" content="A game of 12 hard choices about right and wrong. See what yours say about you.">
<meta name="theme-color" content="#FAFAF8">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Tern">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Quattrocento+Sans:wght@400;700&display=swap">
<style>
  /* Single deliberate look: ink on paper. */
  :root {
    --paper: #FAFAF8;
    --ink: #141414;
    --graphite: #6E6E6A;
    --hair: #DCDCD7;
    --wash: rgba(20, 20, 20, .08);
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); overflow: hidden;
    font-family: "Quattrocento Sans", "Gill Sans", system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  .hint {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 20px);
    transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
    font-size: 13px; letter-spacing: .05em; color: var(--ink); text-align: center;
    background: var(--paper); border: 1px solid var(--hair); border-radius: 999px; padding: 6px 14px;
    pointer-events: none; transition: opacity .8s;
  }
  .hint.gone { opacity: 0; }

  .card {
    position: fixed; left: 50%; bottom: 0; width: min(440px, calc(100% - 32px));
    transform: translate(-50%, 110%);
    transition: transform 800ms cubic-bezier(.2, .75, .2, 1);
    background: var(--paper); border: 1.5px solid var(--ink); border-bottom: none;
    border-radius: 18px 18px 0 0; box-shadow: 0 -12px 40px var(--wash);
    padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 14px;
    max-height: calc(100% - 24px); overflow: auto; touch-action: pan-y;
  }
  .card.open { transform: translate(-50%, 0); }
  .scene { width: 100%; max-width: 100%; aspect-ratio: 16 / 10; display: block; border-radius: 10px; border: 1px solid var(--hair); background: var(--paper); }

  .text { display: flex; flex-direction: column; gap: 12px; transition: opacity 400ms; }
  .text.out { opacity: 0; pointer-events: none; }
  .card.gliding { overflow: hidden; transition: transform 800ms cubic-bezier(.2, .75, .2, 1), height 550ms cubic-bezier(.4, 0, .2, 1); }
  .setup { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 18px; line-height: 1.4; color: var(--graphite); }
  .q { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: clamp(21px, 5.4vw, 26px); line-height: 1.3; text-wrap: balance; }
  .answers { display: flex; flex-direction: column; gap: 8px; }
  .answers button {
    font: inherit; font-size: 16px; text-align: left; padding: 12px 16px;
    background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 12px;
    cursor: pointer; transition: background .2s, color .2s;
  }
  .answers button.opt:hover:not(:disabled) { background: var(--wash); }
  .answers button.opt.picked { border-width: 3px; padding: 10.5px 14.5px; font-weight: 700; background: var(--paper); }
  .answers button.opt.picked::before { content: "●"; margin-right: 8px; font-size: 12px; vertical-align: 2px; }
  .answers button.chosen { background: var(--ink) !important; color: var(--paper); }
  .answers .confirm { margin-top: 4px; text-align: center; background: var(--ink); color: var(--paper); font-weight: 700; }
  .answers .confirm:disabled { background: var(--paper); color: var(--hair); border-color: var(--hair); }
  .answers button:disabled { cursor: default; }
  .answers button:focus-visible, .away:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .away { align-self: center; background: none; border: none; font: inherit; font-size: 13px; color: var(--graphite); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px 8px; }

  /* ---------- character select ---------- */
  .select {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
    background: rgba(250, 250, 248, 0.42);
    padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-inline: 16px;
    transition: opacity 800ms ease; touch-action: manipulation;
  }
  .sel-panel {
    width: min(760px, 100%); height: min(460px, 100%);
    display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; padding: 18px;
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 20px;
    box-shadow: 0 18px 60px rgba(20, 20, 20, 0.16);
  }
  .select.gone { opacity: 0; pointer-events: none; }
  .select[hidden] { display: none; }
  .title { position: fixed; inset: 0; z-index: 11; display: grid; place-items: center; padding: 16px; background: rgba(250, 250, 248, 0.42); transition: opacity 800ms ease; }
  .title[hidden] { display: none; }
  .title.gone { opacity: 0; pointer-events: none; }
  .t-panel { width: min(440px, 100%); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 26px 24px 22px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 20px; box-shadow: 0 18px 60px rgba(20, 20, 20, 0.16); text-align: center; }
  .t-hero { position: relative; width: 160px; height: 130px; }
  .t-hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .t-name { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: clamp(52px, 12vw, 72px); line-height: 1; letter-spacing: .04em; }
  .t-sub { margin: 0 0 10px; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 20px; color: var(--graphite); }
  .t-actions { display: flex; flex-direction: column; align-items: stretch; gap: 8px; width: min(280px, 100%); }
  .sel-profile { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .sel-hero { position: relative; flex: 1 1 auto; min-height: 0; min-width: 0; overflow: hidden; border: 1px solid var(--hair); border-radius: 16px; background: var(--paper); }
  .sel-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .sel-kicker { margin: 0; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--graphite); }
  .select.gone .sel-panel { transform: translateY(12px); }
  .sel-panel { transition: transform 800ms cubic-bezier(.2, .75, .2, 1); }
  .sel-name { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: clamp(32px, 4.4vw, 46px); line-height: 1; }
  .sel-carry { margin: 0; font-size: 13px; color: var(--graphite); }
  .sel-carry b { font-weight: 700; color: var(--ink); letter-spacing: .08em; text-transform: uppercase; font-size: 11px; margin-right: 6px; }
  .sel-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .sel-shuffle { font: inherit; font-size: 15px; padding: 12px 18px; background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 12px; cursor: pointer; }
  .sel-shuffle:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .sel-go {
    font: inherit; font-size: 16px; padding: 12px 22px;
    background: var(--ink); color: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px; cursor: pointer;
  }
  .sel-go:focus-visible, .tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .sel-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 10px; min-height: 0; }
  .tile {
    position: relative; min-height: 0; overflow: hidden; padding: 0; font: inherit; cursor: pointer;
    display: flex; flex-direction: column; background: var(--paper); color: var(--graphite);
    border: 1.5px solid var(--hair); border-radius: 12px; transition: border-color .3s;
  }
  /* canvases sit inside boxes the layout sizes, so drawing never feeds back into layout */
  .sel-hero canvas, .tile .pic canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tile .pic { position: relative; flex: 1 1 auto; min-height: 0; }
  .tile span { font-size: 12px; letter-spacing: .08em; padding: 2px 0 7px; text-align: center; }
  .tile:hover { border-color: var(--graphite); }
  .tile[aria-selected="true"] { border: 2px solid var(--ink); color: var(--ink); }
  .tile[aria-selected="true"] span { font-weight: 700; }
  .tile[aria-selected="true"]::after { /* the same pennant as the park flags */
    content: ""; position: absolute; top: 9px; right: 10px; width: 0; height: 0;
    border-left: 15px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .tile[aria-selected="true"]::before { content: ""; position: absolute; top: 7px; right: 25px; width: 2px; height: 22px; background: var(--ink); border-radius: 1px; }
  @media (orientation: portrait) {
    .sel-panel { width: min(460px, 100%); height: min(640px, 100%); grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.05fr) minmax(0, 1fr); gap: 14px; padding: 14px; }
    .sel-profile { flex-direction: row; align-items: stretch; gap: 14px; }
    .sel-hero { flex: 1 1 48%; }
    .sel-info { flex: 1 1 52%; justify-content: center; }
    .sel-name { font-size: clamp(32px, 9vw, 48px); }
    .sel-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; }
  }


  /* ---------- the card: your earlier answer ---------- */
  .redo { align-self: flex-start; background: none; border: none; font: inherit; font-size: 14px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px 2px; }
  .mine { border: 1.5px solid var(--ink); border-radius: 12px; padding: 10px 14px; }
  .mine span { display: block; font-weight: 700; font-size: 15px; }
  .mine p { margin: 6px 0 0; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 17px; line-height: 1.35; color: var(--graphite); }

  /* ---------- the portrait panel ("You, so far") ---------- */
  :root { --pw: 0px; }
  .portrait {
    position: fixed; z-index: 5; background: var(--paper); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden; touch-action: pan-y;
    transition: transform 800ms cubic-bezier(.2, .75, .2, 1), opacity 800ms;
  }
  .portrait[hidden] { display: none; }
  .p-body { overflow: auto; padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 20px; flex: 1 1 auto; }
  .p-kicker { margin: 0; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--graphite); }
  .p-head { margin: 6px 0 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 27px; line-height: 1.18; text-wrap: balance; }
  .p-desc { margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: var(--graphite); }
  .p-head2 { margin: 0 0 4px; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 21px; line-height: 1.22; text-wrap: balance; }
  .chapter .chips { margin-top: 10px; }
  .p-changed { margin: 8px 0 0; font-size: 12px; letter-spacing: .06em; color: var(--ink); font-style: italic; }
  .p-sec h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--graphite); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1.5px solid var(--ink); border-radius: 999px; padding: 5px 11px; font-size: 13px; line-height: 1.3; }
  .pt { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13.5px; line-height: 1.5; }
  .pt b { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--graphite); margin-bottom: 2px; }
  .bar { display: grid; grid-template-columns: 74px 1fr 74px; align-items: center; gap: 8px; font-size: 12px; margin: 7px 0; }
  .bar span:first-child { text-align: right; } .bar .dim { color: var(--hair); }
  .track { position: relative; height: 10px; border: 1.2px solid var(--ink); border-radius: 999px; }
  .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--graphite); }
  .fill { position: absolute; top: 1px; bottom: 1px; background: var(--ink); border-radius: 999px; transition: left 1.2s, width 1.2s; }
  .torn p { margin: 0 0 8px; font-family: "Cormorant Garamond", Georgia, serif; font-size: 18px; line-height: 1.35; }
  .notes details { border-top: 1px solid var(--hair); padding: 8px 0; }
  .notes summary { cursor: pointer; font-size: 13.5px; font-weight: 700; list-style: none; }
  .notes summary::-webkit-details-marker { display: none; }
  .notes .n { margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; }
  .notes .n i { color: var(--graphite); }
  .p-more { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; padding: 8px 14px; background: none; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 999px; cursor: pointer; }
  .p-more::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: translateY(-2px) rotate(45deg); transition: transform .3s; }
  .p-more[aria-expanded="true"]::after { transform: translateY(2px) rotate(-135deg); }
  .p-more:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .detail { border-left: 1.5px solid var(--ink); padding-left: 14px; }
  .detail h3 + .p-desc { margin: 0 0 4px; }
  .detail .d-item { padding: 12px 0; border-top: 1px solid var(--hair); }
  .detail .d-item:first-of-type { border-top: none; }
  .detail h4 { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 19px; line-height: 1.25; }
  .detail p { margin: 6px 0 0; font-size: 14px; line-height: 1.55; }
  .detail .d-lab { margin: 10px 0 2px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--graphite); font-weight: 700; }
  .detail ul { margin: 0; padding-left: 16px; font-size: 13.5px; line-height: 1.5; }
  .detail li { margin: 4px 0; }
  .detail li i { color: var(--graphite); font-style: normal; }
  .detail h3.d-part { margin-top: 18px; }
  .code { font-family: "Cormorant Garamond", Georgia, serif; font-size: 44px; letter-spacing: .12em; margin: 0; }
  .p-next { border-top: 1.5px solid var(--ink); padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
  .p-next .dots { letter-spacing: .2em; font-size: 14px; }
  .p-tools { display: flex; gap: 14px; flex-wrap: wrap; }
  .p-share { flex-basis: 100%; font: inherit; font-size: 15px; padding: 11px 18px; background: var(--ink); color: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px; cursor: pointer; }
  .p-share:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .link { background: none; border: none; font: inherit; font-size: 13px; color: var(--graphite); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 2px 0; }
  .fresh { animation: fresh 1.4s ease both; }
  @keyframes fresh { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .p-handle { display: none; }
  @media (min-width: 900px) and (orientation: landscape) {
    :root { --pw: 360px; }
    .portrait { top: 0; right: 0; bottom: 0; width: var(--pw); border-left: 1.5px solid var(--ink); }
    .portrait.pre { transform: translateX(100%); }
    .card { left: calc((100% - var(--pw)) / 2); }
    .hint { left: calc((100% - var(--pw)) / 2); }
  }
  @media not ((min-width: 900px) and (orientation: landscape)) {
    .portrait { left: 0; right: 0; bottom: 0; height: min(78vh, 640px); border-top: 1.5px solid var(--ink); border-radius: 18px 18px 0 0; box-shadow: 0 -12px 40px var(--wash); transform: translateY(calc(100% - 64px)); }
    .portrait.pre { transform: translateY(100%); }
    .portrait.up { transform: none; }
    .p-handle { display: flex; flex: 0 0 64px; align-items: center; gap: 12px; padding: 0 20px; border: none; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
    .p-handle .grip { position: absolute; left: 50%; top: 7px; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: var(--hair); }
    .p-handle .t { flex: 1; font-family: "Cormorant Garamond", Georgia, serif; font-size: 19px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-handle .glow { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); opacity: 0; transition: opacity .6s; }
    .portrait.news .p-handle .glow { opacity: 1; }
    .p-handle { touch-action: none; }
    .p-handle .chev { width: 9px; height: 9px; margin: 4px 4px 0; border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: rotate(-135deg); transition: transform .5s; }
    .portrait.up .p-handle .chev { transform: translateY(-5px) rotate(45deg); }
    .p-body { overscroll-behavior: contain; }
    .card { z-index: 6; }
  }


  /* changing text: out in coarse steps, back in in coarse steps */
  .dissolve { animation: dissolve 700ms steps(7) forwards; }
  @keyframes dissolve { to { opacity: 0; filter: blur(6px); } }
  .resolve { animation: resolve 1200ms steps(9) both; }
  @keyframes resolve { from { opacity: 0; filter: blur(7px); } 55% { opacity: .75; filter: blur(2px); } to { opacity: 1; filter: none; } }
  .p-sec.changed { position: relative; }
  .p-sec.changed::before { content: ""; position: absolute; left: -12px; top: 2px; bottom: 2px; width: 3px; border-radius: 2px; background: var(--ink); animation: mark 4s ease forwards; }
  @keyframes mark { 0%, 60% { opacity: 1; } to { opacity: 0; } }
  .p-min, .p-rail { display: none; }
  @media (min-width: 900px) and (orientation: landscape) {
    :root.pmin { --pw: 48px; }
    .card, .hint { transition-property: transform, left, opacity; }
    .p-min { display: block; position: absolute; top: 10px; right: 10px; z-index: 1; width: 30px; height: 30px; border: 1.5px solid var(--ink); border-radius: 50%; background: var(--paper); color: var(--ink); font: inherit; font-size: 18px; line-height: 1; cursor: pointer; }
    .portrait.min .p-body, .portrait.min .p-next, .portrait.min .p-min { display: none; }
    .portrait.min .p-rail { display: flex; flex-direction: column; align-items: center; gap: 14px; flex: 1; padding: 18px 0; border: none; background: none; color: var(--ink); cursor: pointer; font: inherit; }
    .p-rail .v { writing-mode: vertical-rl; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
    .p-rail .glow { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); opacity: 0; transition: opacity .6s; }
    .portrait.min.news .p-rail .glow { opacity: 1; animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.5); opacity: .5; } }
  }
  @media (prefers-reduced-motion: reduce) { .dissolve, .resolve, .p-sec.changed::before, .p-rail .glow { animation-duration: 1ms !important; } }

  /* ---------- arrival moments: headline and code ---------- */
  .reveal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px 16px; background: rgba(250, 250, 248, .94); opacity: 0; transition: opacity 800ms; overflow: auto; }
  .reveal.on { opacity: 1; }
  .reveal[hidden] { display: none; }
  .rv { width: min(560px, 100%); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .rv > * { opacity: 0; transform: translateY(8px); transition: opacity 1000ms, transform 1000ms; }
  .rv > .in { opacity: 1; transform: none; }
  .rv .k { margin: 0; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--graphite); }
  .rv h2 { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: clamp(30px, 6vw, 44px); line-height: 1.15; text-wrap: balance; }
  .rv p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--graphite); max-width: 42ch; }
  .letters { display: flex; gap: clamp(8px, 2.4vw, 18px); font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(56px, 14vw, 92px); line-height: 1; min-height: 1.1em; }
  .letters span { opacity: 0; transform: translateY(10px); transition: opacity 300ms, transform 300ms; }
  .letters span.in { opacity: 1; transform: none; }
  .rv .go { font: inherit; font-size: 16px; padding: 12px 22px; background: var(--ink); color: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px; cursor: pointer; }
  .rv svg { width: min(280px, 70vw); height: auto; }
  .rv-acts { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .rv .go.ghost { background: none; color: var(--ink); border-color: transparent; text-decoration: underline; text-underline-offset: 3px; font-size: 15px; padding: 6px 14px; }
  .rv .go:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* the share screen: what will be sent, before it's sent */
  .share { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); background: rgba(250, 250, 248, .9); opacity: 0; transition: opacity 400ms; overflow: auto; touch-action: pan-y; }
  .share.on { opacity: 1; }
  .share[hidden] { display: none; }

<script>
(() => {
  const INK = '#141414', PAPER = '#FAFAF8', GRAPH = '#6E6E6A', HAIR = '#DCDCD7', TRAIL = '#EDEDE8', SHADOW = 'rgba(20,20,20,0.10)';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;
  const TW = 64, TH = 32, SIZE = 44;
  const iso = (x, y) => ({ x: (x - y) * TW / 2, y: (x + y) * TH / 2 });
  const lerp = (a, b, k) => a + (b - a) * k;
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const sleep = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 60) : ms));
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

  // Wind: a mild breeze with the occasional soft gust drifting across the park.
  const gustAt = t => reduce ? 0 : Math.pow(Math.max(0, Math.sin(t * 0.22)), 3) * 0.28 + Math.pow(Math.max(0, Math.sin(t * 0.09 + 2)), 4) * 0.16;

  function ellipse(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); }

  function limb(g, s, x1, y1, x2, y2) {
    g.strokeStyle = INK; g.lineWidth = 4.8 * s; line(g, x1, y1, x2, y2);
    g.strokeStyle = PAPER; g.lineWidth = 2.3 * s; line(g, x1, y1, x2, y2);
  }

  // ---------- the characters ----------
  // The Puff family: the chosen main-character direction. Eight abstract puffy folks sharing one
  // soft body idea, varied only in form: shape, proportion, fill, and eyes. Nothing symbolic, and
  // no descriptions: a character's blurb could prime how someone answers the questions. Names are playful nicknames, not personality types.
  // top: how tall the figure reaches, hats and umbrellas included (figure units), used to frame portraits.
  const CHARACTERS = [
    { name: 'Mof', look: { style: 'puff', shape: 'puff', eyes: 'sleepy' }, top: 40 },
    { name: 'Nib', look: { style: 'puff', shape: 'round', glasses: true, sweater: true, eyes: 'dots' }, top: 38 },
    { name: 'Sumi', look: { style: 'puff', shape: 'tiny', dark: true, eyes: 'side' }, top: 36 },
    { name: 'Ro', look: { style: 'puff', shape: 'mallow', eyes: 'one' }, top: 36 },
    { name: 'Zig', look: { style: 'puff', shape: 'stack', fill: 'zigzag', eyes: 'sleepy' }, top: 49 },
    { name: 'Zo', look: { style: 'puff', shape: 'oval', band: true }, top: 33 },
    { name: 'Tri', look: { style: 'puff', shape: 'tri', eyes: 'grin', idle: 'hop' }, top: 44 },
    { name: 'Duo', look: { style: 'puff', shape: 'lopsided', fill: 'split', idle: 'sway' }, top: 40 },
  ];
  let myLook = CHARACTERS[0].look, inScene = false;
  // Everyone else in the scenes is a plain, undecorated puff. Each figure keeps the same shape for the
  // whole scene (picked from its phase), and never shares the player's shape, so "you" always stands out.
  const NPC_LOOKS = [
    { style: 'puff', shape: 'round', eyes: 'dots' }, { style: 'puff', shape: 'oval', eyes: 'dots' },
    { style: 'puff', shape: 'twin', eyes: 'sleepy' }, { style: 'puff', shape: 'pear', eyes: 'dots' },
    { style: 'puff', shape: 'wide', eyes: 'dots' }, { style: 'puff', shape: 'rosette', eyes: 'sleepy' },
    { style: 'puff', shape: 'puff', eyes: 'dots' }, { style: 'puff', shape: 'lopsided', eyes: 'dots' },
  ];
  function npcLook(phase) {
    const pool = NPC_LOOKS.filter(l => l.shape !== myLook.shape);
    const k = Math.floor(Math.abs(Math.sin(((phase || 0) + 1) * 91.7)) * 1000) % pool.length;
    return pool[k];
  }

  // o.dir: -1..1 face turn (0 = facing you). o.lArm / o.rArm: hand offset from shoulder, in figure units.
  // o.mood: 'sad' | 'worried' | 'angry' | default (calm, no mouth). o.sit: seated at y.
  // o.me: draw as the player's chosen character. o.look: draw as a given character.
  function drawPerson(g, x, y, o) {
    const look = o.me ? myLook : (o.look || npcLook(o.phase));
    if (look.style && STYLES[look.style]) {
      if (inScene && look.style === 'puff') o = Object.assign({}, o, { scale: (o.scale || 1) * 1.2 }); // puffs are squat; lift them in scenes
      g.save(); STYLES[look.style](g, x, y, o, core(o, look)); g.restore(); return;
    }
    const s =(o.scale || 1) * (look.size || 1), t = o.t || 0, ph = o.phase || 0, d = o.dir || 0;
    const moving = o.moving && !reduce;
    const bob = moving ? Math.abs(Math.sin(o.walk * 2)) * 1.8 * s : (reduce ? 0 : Math.sin(t * 1.6 + ph) * 0.5 * s);
    const sw = moving ? Math.sin(o.walk * 2) * 4 * s : 0;
    const ground = y - (o.hop || 0) * s;
    const Y = o.sit ? ground + 9 * s : ground;
    g.fillStyle = SHADOW; ellipse(g, x, o.sit ? y + 10 * s : y, 10 * s, 4 * s); g.fill();
    g.lineCap = 'round'; g.lineJoin = 'round';
    const hipY = Y - 9 * s - bob;
    if (o.sit) {
      const sd = d < 0 ? -1 : 1;
      for (const lx of [-3.2, 3.2]) {
        limb(g, s, x + lx * s, hipY, x + (lx + 7 * sd) * s, hipY + 0.5 * s);
        limb(g, s, x + (lx + 7 * sd) * s, hipY + 0.5 * s, x + (lx + 8 * sd) * s, hipY + 10 * s);
      }
    } else {
      limb(g, s, x - 3.2 * s, hipY, x - 3.2 * s + sw, Y - 2 * s);
      limb(g, s, x + 3.2 * s, hipY, x + 3.2 * s - sw, Y - 2 * s);
    }
    // body: a soft pill, with the character's shirt
    const ty = Y - 22 * s - bob, body = () => { g.beginPath(); g.roundRect(x - 7.5 * s, ty, 15 * s, 14 * s, 7 * s); };
    body(); g.fillStyle = look.shirt === 'dark' ? INK : PAPER; g.fill();
    if (look.shirt && look.shirt !== 'plain' && look.shirt !== 'dark') {
      g.save(); body(); g.clip(); g.strokeStyle = GRAPH; g.fillStyle = GRAPH; g.lineWidth = 1 * s;
      if (look.shirt === 'stripes') for (let yy = ty + 3 * s; yy < ty + 14 * s; yy += 3.2 * s) line(g, x - 8 * s, yy, x + 8 * s, yy);
      if (look.shirt === 'dots') for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) { ellipse(g, x + (c - 1) * 4.4 * s + (r % 2) * 2.2 * s, ty + 3.5 * s + r * 4 * s, 0.9 * s, 0.9 * s); g.fill(); }
      if (look.shirt === 'twotone') { g.fillStyle = INK; g.fillRect(x - 8 * s, ty + 8 * s, 16 * s, 7 * s); }
      if (look.shirt === 'overalls') {
        g.strokeStyle = INK; g.lineWidth = 1.2 * s; g.strokeRect(x - 4.4 * s, ty + 5 * s, 8.8 * s, 10 * s);
        line(g, x - 4.4 * s, ty + 5 * s, x - 5.5 * s, ty); line(g, x + 4.4 * s, ty + 5 * s, x + 5.5 * s, ty);
        g.fillStyle = INK; ellipse(g, x - 2.6 * s, ty + 6.6 * s, 0.8 * s, 0.8 * s); g.fill(); ellipse(g, x + 2.6 * s, ty + 6.6 * s, 0.8 * s, 0.8 * s); g.fill();
      }
      g.restore();
    }
    body(); g.strokeStyle = INK; g.lineWidth = 1.7 * s; g.stroke();
    if (look.scarf) {
      const fl = reduce ? 0 : Math.sin(t * 1.3 + ph) * 1.2 * s;
      g.beginPath(); g.roundRect(x - 8 * s, ty - 1.4 * s, 16 * s, 4.6 * s, 2.3 * s); g.fillStyle = PAPER; g.fill(); g.strokeStyle = INK; g.lineWidth = 1.4 * s; g.stroke();
      g.strokeStyle = GRAPH; g.lineWidth = 0.9 * s; line(g, x - 3 * s, ty - 1.2 * s, x - 3 * s, ty + 3 * s); line(g, x + 1 * s, ty - 1.2 * s, x + 1 * s, ty + 3 * s);
      limb(g, s * 0.95, x + 4 * s, ty + 2.6 * s, x + 5.5 * s + fl, ty + 11 * s);
    }
    const shY = ty + 4 * s, la = o.lArm || [-3.4, 7.5], ra = o.rArm || [3.4, 7.5];
    limb(g, s, x - 6.5 * s, shY, x - 6.5 * s + la[0] * s - sw * 0.5, shY + la[1] * s);
    limb(g, s, x + 6.5 * s, shY, x + 6.5 * s + ra[0] * s + sw * 0.5, shY + ra[1] * s);
    // head, with anything that sits behind it first
    const hx = x + d * 1.4 * s, hy = ty - 9.5 * s;
    g.fillStyle = PAPER; g.strokeStyle = INK; g.lineWidth = 1.6 * s;
    if (look.hat === 'bun') { ellipse(g, hx, hy - 10.6 * s, 4.4 * s, 4 * s); g.fill(); g.stroke(); }
    if (look.hat === 'hood') {
      for (const sx of [-1, 1]) { ellipse(g, hx + sx * 7.8 * s, hy - 8.6 * s, 3.8 * s, 3.8 * s); g.fillStyle = PAPER; g.fill(); g.stroke(); ellipse(g, hx + sx * 7.8 * s, hy - 8.6 * s, 1.6 * s, 1.6 * s); g.fillStyle = HAIR; g.fill(); }
      ellipse(g, hx, hy + 0.4 * s, 12.8 * s, 12 * s); g.fillStyle = PAPER; g.fill(); g.stroke();
    }
    ellipse(g, hx, hy, 10.5 * s, 9.8 * s); g.fillStyle = PAPER; g.fill(); g.strokeStyle = INK; g.lineWidth = 1.7 * s; g.stroke();
    const fx = hx + d * 3 * s;
    const blink = !reduce && ((t + ph * 3) % 4.6) < 0.12;
    g.fillStyle = INK; g.strokeStyle = INK;
    for (const ex of [-3.4, 3.4]) {
      if (blink) { g.lineWidth = 1 * s; line(g, fx + ex * s - 1.1 * s, hy + 0.8 * s, fx + ex * s + 1.1 * s, hy + 0.8 * s); }
      else { ellipse(g, fx + ex * s, hy + 0.6 * s, 1.2 * s, 1.5 * s); g.fill(); }
    }
    if (look.glasses) {
      g.lineWidth = 1.1 * s;
      for (const ex of [-3.6, 3.6]) { ellipse(g, fx + ex * s, hy + 0.6 * s, 3.1 * s, 3.1 * s); g.stroke(); }
      line(g, fx - 0.5 * s, hy + 0.2 * s, fx + 0.5 * s, hy + 0.2 * s);
    }
    g.lineWidth = 1.1 * s;
    if (o.mood === 'sad' || o.mood === 'worried') {
      line(g, fx - 5.2 * s, hy - 3.2 * s, fx - 1.8 * s, hy - 4.4 * s); line(g, fx + 1.8 * s, hy - 4.4 * s, fx + 5.2 * s, hy - 3.2 * s);
    } else if (o.mood === 'angry') {
      line(g, fx - 5.2 * s, hy - 4.6 * s, fx - 1.8 * s, hy - 3.2 * s); line(g, fx + 1.8 * s, hy - 3.2 * s, fx + 5.2 * s, hy - 4.6 * s);
    }
    if (o.mood === 'sad') { g.beginPath(); g.arc(fx, hy + 5.6 * s, 2.1 * s, 1.22 * Math.PI, 1.78 * Math.PI); g.stroke(); }
    else if (o.mood === 'worried') { ellipse(g, fx, hy + 4 * s, 1.1 * s, 1.2 * s); g.stroke(); }
    else if (o.mood === 'angry') line(g, fx - 2.3 * s, hy + 4 * s, fx + 2.3 * s, hy + 4 * s);
    else { g.fillStyle = 'rgba(20,20,20,0.10)'; for (const ex of [-5.6, 5.6]) { ellipse(g, fx + ex * s, hy + 3.4 * s, 1.9 * s, 1.1 * s); g.fill(); } }
    // anything worn on top of the head
    g.fillStyle = PAPER; g.strokeStyle = INK; g.lineWidth = 1.5 * s;
    if (look.hat === 'bucket') {
      g.beginPath(); g.moveTo(hx - 8 * s, hy - 4.6 * s); g.bezierCurveTo(hx - 8 * s, hy - 15 * s, hx + 8 * s, hy - 15 * s, hx + 8 * s, hy - 4.6 * s); g.closePath(); g.fill(); g.stroke();
      ellipse(g, hx, hy - 4.6 * s, 13 * s, 3.1 * s); g.fill(); g.stroke();
      g.strokeStyle = GRAPH; g.lineWidth = 1 * s; line(g, hx - 7.4 * s, hy - 7.4 * s, hx + 7.4 * s, hy - 7.4 * s);
    } else if (look.hat === 'beanie') {
      g.beginPath(); g.moveTo(hx - 10.2 * s, hy - 3 * s); g.bezierCurveTo(hx - 10.2 * s, hy - 15 * s, hx + 10.2 * s, hy - 15 * s, hx + 10.2 * s, hy - 3 * s); g.closePath(); g.fill(); g.stroke();
      g.beginPath(); g.roundRect(hx - 10.8 * s, hy - 5.4 * s, 21.6 * s, 4.6 * s, 2.2 * s); g.fill(); g.stroke();
      g.strokeStyle = GRAPH; g.lineWidth = 0.9 * s; for (let k = -8; k <= 8; k += 2.6) line(g, hx + k * s, hy - 4.6 * s, hx + k * s, hy - 1.6 * s);
      g.strokeStyle = INK; g.lineWidth = 1.5 * s; ellipse(g, hx, hy - 13.4 * s, 3 * s, 3 * s); g.fill(); g.stroke();
    } else if (look.hat === 'sprout') {
      const sway = reduce ? 0 : Math.sin(t * 1.3 + ph) * 0.14;
      g.save(); g.translate(hx, hy - 9.4 * s); g.rotate(sway);
      g.lineWidth = 1.3 * s; line(g, 0, 0, 0, -6 * s);
      for (const [sx, rot] of [[-1, -0.6], [1, 0.5]]) { g.save(); g.translate(0, -5.4 * s); g.rotate(rot); ellipse(g, sx * 3.6 * s, 0, 3.6 * s, 1.9 * s); g.fill(); g.stroke(); g.restore(); }
      g.restore();
    } else if (look.hat === 'bun') {
      g.lineWidth = 1.2 * s; line(g, hx - 2.8 * s, hy - 8.2 * s, hx + 2.8 * s, hy - 8.2 * s);
    }
    if (look.hair === 'curls') {
      for (const deg of [-165, -140, -115, -90, -65, -40, -15]) {
        const a = deg * Math.PI / 180;
        ellipse(g, hx + Math.cos(a) * 9.4 * s, hy - 1 * s + Math.sin(a) * 8.6 * s, 3.8 * s, 3.6 * s); g.fill(); g.stroke();
      }
    }
  }

  // ---------- the seven other drawing styles ----------
  // Each takes the same pose inputs (walk, facing, arm offsets, sit, hop, mood) so it works
  // in the park and inside every question scene.
  function core(o, look) {
    const s = (o.scale || 1) * (look.size || 1), t = o.t || 0, ph = o.phase || 0, d = o.dir || 0;
    const moving = o.moving && !reduce, walk = o.walk || 0;

  // Stop props in the Neighborhood (the map-side picture of each question's place).

        line(g, a.x, a.y, a.x, a.y - 8); line(g, b.x, b.y, b.x, b.y - 8);
        poly(g, [{ x: a.x - 3, y: a.y - 8 }, { x: b.x - 3, y: b.y - 8 }, { x: b.x + 3, y: b.y - 11 }, { x: a.x + 3, y: a.y - 11 }]); g.fill(); g.stroke();

      case 'stoop': { // a front stoop: steps up to a door, with a rail

  }

  function drawHill(g, h, t) {
    const p = toScreen(h.x, h.y), base = h.r * TW * 0.62, layers = 4;
    g.fillStyle = SHADOW; ellipse(g, p.x + 6, p.y + 4, base, base / 2); g.fill();
    for (let i = 0; i < layers; i++) {
      const rx = base * (1 - i * 0.2), cy = p.y - i * 11;
      ellipse(g, p.x, cy, rx, rx / 2); g.fillStyle = PAPER; g.fill();
      g.strokeStyle = i === 0 ? INK : GRAPH; g.lineWidth = i === 0 ? 1.8 : 1.1; g.stroke();
    }
    const top = p.y - (layers - 1) * 11;
    drawPine(g, { x: p.x - 8, y: top + 2 }, { s: 0.7, ph: h.x, x: h.x, y: h.y }, t);
    drawPine(g, { x: p.x + 9, y: top + 5 }, { s: 0.85, ph: h.y, x: h.x, y: h.y }, t);
  }

  function drawFlag(g, n, t) {
    const f = toScreen(n.flag[0], n.flag[1]), top = f.y - 58, bob = reduce ? 0 : Math.sin(t * 1.1 + n.x) * 1;
    g.fillStyle = SHADOW; ellipse(g, f.x, f.y, 5, 2); g.fill();
    g.strokeStyle = INK; g.lineWidth = 2.2; g.lineCap = 'round'; line(g, f.x, f.y, f.x, top);
    ellipse(g, f.x, top - 1, 2.6, 2.6); g.fillStyle = INK; g.fill();
    const drop = 0, segs = 8, len = n.done ? 30 : 26, wv = u => reduce ? 0 : Math.sin(t * 2.2 - u * 3 + n.x) * 1.5 * u;
    g.beginPath(); g.moveTo(f.x + 1, top + 2 + drop);
    for (let i = 1; i <= segs; i++) { const u = i / segs; g.lineTo(f.x + 1 + u * len, top + 2 + drop + u * 8 + wv(u) + bob * u); }
    for (let i = segs; i >= 0; i--) { const u = i / segs; g.lineTo(f.x + 1 + u * len, top + 18 + drop - u * 8 + wv(u) + bob * u); }
    g.closePath();
    g.fillStyle = n.done ? PAPER : INK; g.fill(); g.strokeStyle = INK; g.lineWidth = n.done ? 2.2 : 1.6; g.stroke();
    if (n.done) { // a bold check on a paper pennant: clearly "been here", clearly not a "?"
      const w = u => wv(u) + bob * u;
      g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
      g.moveTo(f.x + 7, top + 10 + w(0.25)); g.lineTo(f.x + 11, top + 14 + w(0.35)); g.lineTo(f.x + 19, top + 5 + w(0.6)); g.stroke();
    }
  }

  function drawProp(g, n, t) {
    const p = toScreen(n.x, n.y);

  // No wayfinding. But once an unvisited stop is on screen it quietly announces itself:
  // a "?" bubble fades up over its flag and floats there, bobbing slowly.
  function drawBeacons(t) {
    nodes.forEach(n => {

  // Later worlds: each region sits under fog until it opens, then the fog thins slowly (fog[id] eases from 1 to 0).
  // Past the last built region, the next world waits as a faint sketch once you're most of the way through.
  const wopen = {}, fog = {}, fogT = {};
  REGIONS.forEach(r => { wopen[r.id] = false; fog[r.id] = fogT[r.id] = 1; });
  const isOpen = n => n.world === 'park' || (wopen[n.world] && fogT[n.world] < 0.5); // stops wake once the fog starts lifting

  function drawFogs(t) {

  const soonWorld = () => { const w = P && P.worlds && P.worlds.find(x => x.soon && x.ready); return w && wopen[REGIONS[REGIONS.length - 1].id] ? w : null; };

  function updateAnimals(dt) {
    animals.forEach(a => {
      const dp = dist(a.x, a.y, player.x, player.y);
      if (a.kind === 'deer') {
        const alert = dp < 4;
        a.head = lerp(a.head, alert || a.moving ? 1 : (Math.sin(a.ph + performance.now() / 3000) > 0.3 ? 1 : 0), 1 - Math.exp(-dt * 3));

  function updateAmbient(dt, t) {

  let pending = null;
  function updateWorld(dt) {

    if (keys.has('ArrowDown') || keys.has('s')) { kx += 1; ky += 1; }
    if (keys.has('ArrowLeft') || keys.has('a')) { kx -= 1; ky += 1; }

      if (!n.done && !n.snoozed && !cardOpen && !selecting && !pending && d < 0.8 && isOpen(n)) {

  // ---------- the question card ----------
  const card = document.getElementById('card'), textEl = document.getElementById('text');

      g.fillStyle = 'rgba(20,20,20,0.05)'; ellipse(g, gx, gy, s * 24, s * 6); g.fill();
      g.strokeStyle = GRAPH; g.lineWidth = 1.2;
      [[-17, 0], [15, 2], [-6, 4]].forEach(([dx, dy]) => { const bx = gx + dx * s, by = gy + dy * s; line(g, bx - 2 * s, by, bx - 3 * s, by - 4 * s); line(g, bx, by, bx, by - 5 * s); line(g, bx + 2 * s, by, bx + 3 * s, by - 4 * s); });
      drawPerson(g, gx, gy, { look: CHARACTERS[selIdx].look, scale: s, t, dir: 0, hop: reduce ? 0 : Math.sin(heroHop * Math.PI) * 5 });
    }
    // the grid: head-and-shoulders portraits
    tiles.forEach((tl, i) => {
      const f = fitCanvas(tl.cvs); if (!f.w || !f.h) return;
      const g = tl.g; g.setTransform(f.dpr, 0, 0, f.dpr, 0, 0); g.fillStyle = PAPER; g.fillRect(0, 0, f.w, f.h);
      const c = CHARACTERS[i], look = c.look, top = c.top || 46, s = Math.min(f.h * 0.9 / (top - 8), f.w / 36);
      const Y = f.h * 0.06 + top * s; // whole figure fits from the top; the feet crop off
      drawPerson(g, f.w / 2, Y, { look, scale: s, t: t + i * 0.7, phase: i, dir: 0 });
    });
  }
  function startWalking() {
    if (!selecting) return;
    myLook = CHARACTERS[selIdx].look; heroHop = 1;
    selecting = false; state.char = selIdx; state.started = true; save();
    setTimeout(() => selEl.classList.add('gone'), 250);
    const again = changing; changing = false;
    setTimeout(() => { selEl.hidden = true; say(again ? 'Same answers, new look.' : coarse ? 'Tap anywhere to walk · explore the park' : 'Click anywhere to walk · explore the park', again ? 2200 : 0); }, 1100);
  }
  // Change your character any time. Your answers stay exactly as they are.
  let changing = false;
  function changeCharacter() {
    if (selecting || cardOpen) return;
    changing = true; selecting = true; keys.clear(); player.tx = player.ty = null; player.path = null;
    document.getElementById('selGo').textContent = 'Keep walking';
    pickChar(state.char || 0);
    selEl.hidden = false; selEl.classList.add('gone');
    requestAnimationFrame(() => requestAnimationFrame(() => selEl.classList.remove('gone')));
    setTimeout(() => tiles[selIdx].b.focus({ preventScroll: true }), 300);
  }
  document.getElementById('selGo').addEventListener('click', startWalking);
  document.getElementById('selShuffle').addEventListener('click', () => {
    let n = selIdx; while (n === selIdx) n = Math.floor(Math.random() * CHARACTERS.length);
    pickChar(n);
  });
  addEventListener('keydown', e => {
    if (!selecting || selEl.hidden || !document.getElementById('reveal').hidden) return;
    const cols = matchMedia('(orientation: portrait)').matches ? 4 : 2;
    const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols };
    if (moves[e.key] != null) {
      e.preventDefault();
      const n = Math.max(0, Math.min(CHARACTERS.length - 1, selIdx + moves[e.key]));
      pickChar(n); tiles[n].b.focus({ preventScroll: true });
    } else if (e.key === 'Enter' && document.getElementById('reveal').hidden && (document.activeElement.tagName !== 'BUTTON' || document.activeElement.classList.contains('tile'))) { e.preventDefault(); startWalking(); }
  });
  pickChar(0);

  // ---------- title screen (first visit) ----------
  const titleEl = document.getElementById('title'), tHero = document.getElementById('tHero'), tctx = tHero.getContext('2d');
  function drawTitle(t) {
    const { w, h, dpr } = fitCanvas(tHero); if (!w) return;
    const g = tctx; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = PAPER; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(20,20,20,0.05)'; ellipse(g, w / 2, h * 0.9, w * 0.3, 7); g.fill();
    drawPerson(g, w / 2, h * 0.88, { look: CHARACTERS[0].look, scale: h / 48, t, dir: 0 });
  }
  function showTitle() { titleEl.hidden = false; setTimeout(() => document.getElementById('tGo').focus({ preventScroll: true }), 300); }
  document.getElementById('tGo').addEventListener('click', () => {
    titleEl.classList.add('gone');
    setTimeout(() => { titleEl.hidden = true; titleEl.classList.remove('gone'); }, 800);
    selEl.hidden = false; setTimeout(() => tiles[selIdx].b.focus({ preventScroll: true }), 300);
  });
  document.getElementById('tWhat').addEventListener('click', showAbout);
  document.getElementById('tPrivacy').addEventListener('click', showPrivacy);
  function showAbout() {
    return arrive(`<p class="k">What is Tern?</p><h2 style="font-size:clamp(26px,5vw,34px)">A quiet walk through hard questions.</h2>`
      + `<p>Each flag in the park marks a dilemma with no easy way out. Walk to one, look at the scene, and choose what you would really do. Sometimes a follow-up changes the situation.</p>`
      + `<p>As you answer, a portrait of how you decide takes shape beside the map: short notes about you, what you protect, what you’d trade away, and where you’re torn.</p>`
      + `<p>There are no right answers. Go with your honest first call. You can revisit any question later.</p>`
      + `<p>Answer every flag in the park to see your full portrait and your code. Then a new place opens.</p>`
      + `<button class="go" type="button">Got it</button>`);
  }

  // ---------- loop ----------
  let last = performance.now(), T = 0, skip = false;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
    if (!selEl.hidden) drawSelect(T);
    if (!titleEl.hidden) drawTitle(T);
    updateWorld(dt);
    const behind = cardOpen && sheet() && Math.abs(cam.off + Math.min(innerHeight * 0.3, 280)) < 1;
    if (!behind || (skip = !skip)) { drawWorld(T); drawVeil(); }
    if (scene && (cardOpen || sc.fade < 0.99)) { updateScene(dt); if (scv.width) drawScene(); }
    requestAnimationFrame(frame);
  }
  // Dev hook for checking scenes: __tern.open('B09')
  window.__tern = { state, review: id => openReview(nodes.find(n => n.id === id)), go: (x, y) => { player.x = cam.x = x; player.y = cam.y = y; player.tx = player.ty = null; player.path = null; }, walk: (x, y) => walkTo(x, y), where: () => ({ x: player.x, y: player.y, tx: player.tx, ty: player.ty, route: player.path, path: player.path && player.path.length, inWall: solidAt(player.x, player.y) }),
    card: async (answers, lines) => { const keep = P; if (answers) P = TernPortrait.compute(CONTENT, answers); const b = await shareCard(lines || P.tendencies.filter(t => t.share).slice(0, SHARE_MAX).map(t => t.share)); P = keep; return await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); },
    icon: (size, round, div) => { // Mof, the neutral one, as the app icon
      const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
      g.fillStyle = PAPER; if (round) { g.beginPath(); g.arc(size / 2, size / 2, size / 2, 0, 7); g.fill(); } else g.fillRect(0, 0, size, size);
      drawPerson(g, size / 2, size * (div ? 0.74 : 0.84), { look: CHARACTERS[0].look, scale: size / (div || (size < 48 ? 44 : 58)), t: 1, dir: 0 });
      return c.toDataURL('image/png');
    }, poke: () => { player.point = 3.2; }, wipe: () => { resetting = true; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); }, open: id => { const n = nodes.find(n => n.id === id); if (n) { player.x = n.stand[0]; player.y = n.stand[1]; openCard(n); } } };

  // Coming back: skip the character select and pick up where you left off.
  load();
  if (!state.started) { selEl.hidden = true; showTitle(); }
  if (state.started) {
    selIdx = Math.min(state.char || 0, CHARACTERS.length - 1); pickChar(selIdx); myLook = CHARACTERS[selIdx].look;
    selecting = false; selEl.hidden = true;
    if (state.pos) { [player.x, player.y] = freeNear(...clampPt(state.pos.x, state.pos.y)); cam.x = player.x; cam.y = player.y; }
    if (state.zoom) { zoomTo(state.zoom); Z = zoomT; }
    setTimeout(() => say('Welcome back.', 2500), 600);
  }
  renderPortrait();
  if (P.count) showPanel();
  resize();
  requestAnimationFrame(frame);
})();
</script>
